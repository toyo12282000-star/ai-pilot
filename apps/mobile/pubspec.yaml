name: ai_pilot
description: "AI Pilot"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: 2.8.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/app_icon/app_icon.png
  adaptive_icon_background: "#5B5CEB"
  adaptive_icon_foreground: assets/app_icon/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/app_icon/app_icon.png
    background_color: "#5B5CEB"
    theme_color: "#5B5CEB"

flutter_native_splash:
  color: "#F8FAFC"
  image: assets/app_icon/splash_logo.png
  android_12:
    color: "#F8FAFC"
    image: assets/app_icon/splash_logo.png
  web: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/app_icon/
